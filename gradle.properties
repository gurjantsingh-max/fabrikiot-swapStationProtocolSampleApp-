org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# LIVE MQTT broker (HW1). TLS 1.2 with mutual X.509 auth; cert files are in
# app/src/main/assets/hw1/.
#
# Topic structure is FIXED in code (core/config/LiveTopics.kt):
#   <org>/<stationType>/<version>/<stationId>/RPC/REQUEST   Server -> Station
#   <org>/<stationType>/<version>/<stationId>/PERIODIC      Station -> Server (heartbeat)
#   <org>/<stationType>/<version>/<stationId>/EVENTS        Station -> Server
# Only the values below are configuration. Override without editing this file:
#   ./gradlew assembleDebug -Plive.station.id=testingStation_02
# ---------------------------------------------------------------------------
live.mqtt.host=hw1.buzzenergy.in
live.mqtt.port=11883
live.topic.org=ITPL
live.topic.stationType=testingStation
live.topic.version=500.0.0
live.station.id=testingStation_01

# Periodic heartbeat (Station -> Server, PERIODIC topic), sent while connected.
live.heartbeat.intervalSeconds=20
# Number of slots reported in heartbeat slotPayloads[] (spec: slot ids 1-9).
live.station.slotCount=9
